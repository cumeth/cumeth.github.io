<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대사 발췌기</title>

<!-- Bookk Myungjo: Light / Bold webfont -->
<style>
@font-face{
  font-family:"BookkMyungjo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"BookkMyungjo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:"BookkGothic";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"BookkGothic";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@300;400;500;600;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --ui-bg:#111;
  --ui-panel:#1a1a1a;
  --ui-panel2:#161616;
  --ui-border:#2d2d2d;
  --ui-text:#eee;
  --ui-muted:#8a8a8a;

  --stage:#0f0f0f;
  --paper:#f3f2ef;
  --ink:#141414;
  --rule:#161616;
  --bubble:#fff;

  --body-font:"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif;
  --title-font:"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;

  --body-size:16px;
  --title-size:37px;
  --name-size:23px;
  --font-weight:400;
  --title-weight:700;
  --letter-spacing:-.018em;
  --line-height:1.95;
  --paragraph-gap:14px;
  --pad-x:64px;
  --pad-y:60px;
  --title-gap:102px;
  --content-width:76%;
  --rule-width:1px;
  --bubble-radius:17px;
}

*{box-sizing:border-box}
html,body{
  margin:0; min-height:100%;
  background:var(--stage); color:var(--ui-text);
  font-family:var(--sans)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  display:grid;
  grid-template-columns:390px minmax(0,1fr);
  min-height:100vh
}
.sidebar{
  position:sticky; top:0; height:100vh; overflow:auto;
  padding:18px;
  background:var(--ui-bg);
  border-right:1px solid #252525
}
.brand{
  display:flex; align-items:flex-end; justify-content:space-between;
  padding-bottom:14px; margin-bottom:14px;
  border-bottom:1px solid #252525
}
.brand h1{margin:0;font-size:18px;letter-spacing:-.05em}
.brand small{font-size:8px;color:#5f5f5f;letter-spacing:.16em}
.notice{
  margin-bottom:11px;padding:10px 11px;
  border:1px solid #292929;border-radius:8px;
  background:#171717;color:#808080;
  font-size:9px;line-height:1.65
}
.panel{
  margin-bottom:11px;padding:13px;
  border:1px solid var(--ui-border);
  border-radius:11px;background:var(--ui-panel)
}
.panel h2{
  margin:0 0 11px;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:#ababab
}
.control{margin-bottom:10px}.control:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;gap:7px}.grow{flex:1}.wrap{flex-wrap:wrap}
label{display:block;margin-bottom:5px;color:#929292;font-size:10px}
input[type=text],textarea,select{
  width:100%;color:#eee;background:#0e0e0e;
  border:1px solid #383838;border-radius:7px;outline:none
}
input[type=text],select{height:35px;padding:0 9px}
textarea{min-height:96px;padding:8px 9px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:#777}
input[type=color]{
  width:100%;height:35px;padding:3px;
  background:#0e0e0e;border:1px solid #383838;border-radius:7px
}
.btn{
  height:34px;padding:0 10px;
  color:#eee;background:#242424;
  border:1px solid #3b3b3b;border-radius:7px;font-size:11px
}
.btn:hover{background:#2c2c2c}
.btn.primary{background:#eee;color:#111;border-color:#eee}
.btn.danger{color:#ffaaaa}
.btn.tiny{height:28px;padding:0 8px;font-size:10px}
.range{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:7px;align-items:center}
input[type=range]{width:100%}
output{font-size:10px;text-align:right;color:#aaa}
.hint{margin-top:7px;font-size:9px;line-height:1.6;color:#6f6f6f}

.person-editor{
  margin-top:11px;padding-top:11px;
  border-top:1px solid #2e2e2e
}
.person-editor:first-child{margin-top:0;padding-top:0;border-top:0}
.person-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:7px
}
.micro{font-size:9px;letter-spacing:.11em;color:#666}
.entry{
  margin:8px 0;padding:8px;
  border:1px solid #303030;border-radius:8px;background:var(--ui-panel2)
}
.entry-top{
  display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:6px
}
.entry-tools{display:flex;align-items:center;gap:7px}
.checkbox{display:flex;align-items:center;gap:4px;font-size:9px;color:#aaa}
.checkbox input{accent-color:#fff}
.empty{
  padding:12px;border:1px dashed #3a3a3a;border-radius:8px;
  text-align:center;color:#686868;font-size:10px
}

.preview-area{
  min-width:0;
  padding:36px 28px 72px;
  display:flex;justify-content:center;
  background:
    radial-gradient(circle at 50% 0%,#242424 0%,#141414 42%,#0b0b0b 100%)
}
.preview-wrap{width:min(100%,880px)}
.preview-toolbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px
}
.live{font-size:9px;letter-spacing:.15em;color:#747474}
.paper-frame{padding-bottom:12px}

.page{
  width:794px;max-width:100%;min-height:1123px;
  margin:0 auto 24px;position:relative;overflow:hidden;
  background:var(--paper);color:var(--ink);
  padding:var(--pad-y) var(--pad-x);
  box-shadow:0 24px 58px rgba(0,0,0,.38)
}
.page-inner{width:var(--content-width);margin:0 auto}

/* Literary layout: deliberately close to the submitted reference */
.literary .page-inner{
  display:flex;flex-direction:column;
  min-height:calc(1123px - (var(--pad-y) * 2) - 30px)
}
.kicker{
  text-align:center;
  font:700 11px/1 var(--sans);
  letter-spacing:.2em;
  margin-top:2px;
  margin-bottom:40px
}
.title{
  max-width:640px;
  margin:0 auto;
  text-align:center;
  white-space:pre-wrap;
  font-family:var(--title-font);
  font-size:var(--title-size);
  font-weight:var(--title-weight);
  line-height:1.16;
  letter-spacing:var(--letter-spacing);
  /* no line under title */
}
.literary-body{
  margin-top:var(--title-gap);
  font-family:var(--body-font);
  font-size:var(--body-size);
  font-weight:var(--font-weight);
  line-height:var(--line-height);
  letter-spacing:var(--letter-spacing);
  overflow-wrap:anywhere
}
.paragraph{
  margin:0 0 var(--paragraph-gap);
  white-space:pre-wrap
}
.paragraph:last-child{margin-bottom:0}

/* Archive layout — notebook/rule-paper treatment.
   Each textarea is one continuous text block. Its own wrapped visual lines
   receive horizontal rules, like writing on ruled notebook paper. */
.archive .body{
  font-family:var(--body-font);
  font-size:var(--body-size);
  font-weight:var(--font-weight);
  line-height:var(--line-height);
  letter-spacing:var(--letter-spacing)
}
.archive-person{margin:0 0 38px}
.archive-row{
  display:grid;
  grid-template-columns:36% 64%;
  column-gap:0;
  align-items:start
}
.archive-person-meta{padding:0 30px 0 0}
.archive-name{
  font-family:var(--sans);
  font-size:var(--name-size);
  line-height:1.12;
  font-weight:800;
  letter-spacing:-.045em;
  margin:0
}
.archive-sub{
  margin-top:6px;
  font-family:var(--body-font);
  font-size:10px;
  line-height:1.3;
  font-weight:400;
  letter-spacing:.01em;
  opacity:.66;
  word-break:keep-all
}
.archive-quotes{min-width:0;padding-top:0}
.archive-line{
  --rule-step:calc(var(--body-size) * var(--line-height));
  display:block;
  width:100%;
  min-height:var(--rule-step);
  margin:0;
  padding:0 0 1px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  border:0;
  background-image:linear-gradient(
    to bottom,
    transparent calc(var(--rule-step) - var(--rule-width)),
    var(--rule) calc(var(--rule-step) - var(--rule-width)),
    var(--rule) var(--rule-step)
  );
  background-size:100% var(--rule-step);
  background-repeat:repeat-y;
  background-position:left top
}
.archive-line + .archive-line{margin-top:calc(var(--body-size) * .55)}
.archive-line.bubble + .archive-line{margin-top:10px}

/* Footer */
.footer{
  position:absolute;
  left:var(--pad-x);right:var(--pad-x);bottom:26px;
  display:flex;align-items:flex-end;justify-content:center;
  min-height:18px;
  font:8.5px var(--sans);
  letter-spacing:.04em;
  color:var(--ink);
  opacity:.72
}
.footer .coupling{
  position:absolute;right:0;bottom:0;
  max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.footer .page-num{
  min-width:18px;text-align:center
}
.footer.left .page-num{margin-right:auto}
.footer.right .page-num{margin-left:auto}

.watermark{
  position:absolute;left:0;right:0;bottom:8px;
  text-align:center;font:6px var(--sans);
  letter-spacing:.08em;opacity:.12
}

@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto}
  .preview-area{padding:20px 9px 55px}
}
@media print{
  html,body{background:#fff!important}
  .sidebar,.preview-toolbar{display:none!important}
  .app{display:block}
  .preview-area{padding:0;background:#fff!important}
  .page{
    width:210mm;min-height:297mm;margin:0;
    box-shadow:none;
    break-after:page;page-break-after:always
  }
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><h1>대사 발췌기</h1><small>QUOTE EXTRACTOR</small></div>
  <div class="notice">
    문학 페이지는 두 번째 레퍼런스의 넓은 여백·중앙 제목·장문 본문 비율을 기준으로 다시 정리했습니다.
    제목 아래에는 선을 넣지 않습니다.
  </div>

  <section class="panel">
    <h2>문서</h2>
    <div class="control"><label>레이아웃</label><select id="layout"><option value="literary">문학 페이지</option><option value="archive">인물별 발췌</option></select></div>
    <div class="control"><label>상단 작은 표기</label><input id="kicker" type="text"></div>
    <div class="control"><label>글 제목</label><textarea id="title"></textarea></div>
    <div class="grid2">
      <div class="control"><label>하단 커플링명</label><input id="coupling" type="text"></div>
      <div class="control"><label>페이지 번호</label><select id="pageNumber"><option value="show">표시</option><option value="hide">숨김</option></select></div>
    </div>
    <div class="control"><label>페이지 번호 위치</label><select id="pagePosition"><option value="center">가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></div>
  </section>

  <section class="panel">
    <h2>타이포그래피</h2>
    <div class="control"><label>본문 폰트</label><select id="font">
      <option value='"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif'>부크크 명조체 ★</option>
      <option value='"BookkGothic","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'>부크크 고딕체 ★</option>
      <option value='"Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif'>Noto Serif KR</option>
      <option value='"Nanum Myeongjo",serif'>나눔명조</option>
      <option value='"Gowun Batang",serif'>고운바탕</option>
      <option value='Georgia,"Times New Roman",serif'>Georgia</option>
      <option value='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'>Noto Sans KR</option>
      <option value='"Courier New",monospace'>Courier New</option>
    </select></div>
    <div class="control"><label>제목 폰트</label><select id="titleFont">
      <option value='"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif'>부크크 명조체</option>
      <option value='"BookkGothic","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'>부크크 고딕체</option>
      <option value='"Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif'>Noto Serif KR</option>
      <option value='"Nanum Myeongjo",serif'>나눔명조</option>
      <option value='"Gowun Batang",serif'>고운바탕</option>
      <option value='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'>Noto Sans KR</option>
    </select></div>

    <div class="control">
      <label>부크크 폰트 프리셋</label>
      <div class="grid2">
        <button class="btn tiny" id="bookkMyungjoNormal">명조 기본체</button>
        <button class="btn tiny" id="bookkMyungjoBold">명조 볼드체</button>
        <button class="btn tiny" id="bookkGothicNormal">고딕 기본체</button>
        <button class="btn tiny" id="bookkGothicBold">고딕 볼드체</button>
      </div>
    </div>

    <div class="grid2">
      <div class="control"><label>본문 크기</label><div class="range"><input id="bodySize" type="range" min="10" max="28" step=".5"><output id="bodySizeOut"></output></div></div>
      <div class="control"><label>제목 크기</label><div class="range"><input id="titleSize" type="range" min="22" max="65"><output id="titleSizeOut"></output></div></div>
      <div class="control"><label>인물명 크기</label><div class="range"><input id="nameSize" type="range" min="14" max="38"><output id="nameSizeOut"></output></div></div>
      <div class="control"><label>본문 폰트 굵기</label><div class="range"><input id="fontWeight" type="range" min="300" max="800" step="100"><output id="fontWeightOut"></output></div></div>
      <div class="control"><label>제목 폰트 굵기</label><div class="range"><input id="titleWeight" type="range" min="300" max="800" step="100"><output id="titleWeightOut"></output></div></div>
      <div class="control"><label>줄간격</label><div class="range"><input id="lineHeight" type="range" min="1.25" max="2.6" step=".05"><output id="lineHeightOut"></output></div></div>
      <div class="control"><label>자간</label><div class="range"><input id="letterSpacing" type="range" min="-0.09" max=".12" step=".005"><output id="letterSpacingOut"></output></div></div>
      <div class="control"><label>문단 간격</label><div class="range"><input id="paragraphGap" type="range" min="0" max="45"><output id="paragraphGapOut"></output></div></div>
      <div class="control"><label>좌우 여백</label><div class="range"><input id="padX" type="range" min="25" max="115"><output id="padXOut"></output></div></div>
      <div class="control"><label>상하 여백</label><div class="range"><input id="padY" type="range" min="30" max="110"><output id="padYOut"></output></div></div>
      <div class="control"><label>제목 ↔ 본문 간격</label><div class="range"><input id="titleGap" type="range" min="30" max="190"><output id="titleGapOut"></output></div></div>
      <div class="control"><label>글 폭</label><div class="range"><input id="contentWidth" type="range" min="55" max="100"><output id="contentWidthOut"></output></div></div>
    </div>
  </section>

  <section class="panel">
    <h2>색상 / 선</h2>
    <div class="grid2">
      <div class="control"><label>바깥 배경</label><input id="stage" type="color"></div>
      <div class="control"><label>페이지 배경</label><input id="paper" type="color"></div>
      <div class="control"><label>글자색</label><input id="ink" type="color"></div>
      <div class="control"><label>선 색상</label><input id="line" type="color"></div>
      <div class="control"><label>말풍선 배경</label><input id="bubble" type="color"></div>
      <div class="control"><label>선 두께</label><select id="ruleWidth"><option value="1px">1px — 전체 동일</option><option value="1.5px">1.5px — 전체 동일</option><option value="2px">2px — 전체 동일</option></select></div>
    </div>
  </section>

  <section class="panel">
    <h2>인물 & 대사</h2>
    <div class="hint" style="margin-bottom:9px">한 칸에 문장을 통째로 붙여 넣으면 됩니다. 인물별 발췌에서는 긴 글이 자동 줄바꿈되고, 실제 보이는 각 줄 아래에 공책처럼 줄선이 반복됩니다.</div>
    <div id="editors"></div>
    <div class="row wrap" style="margin-top:10px">
      <button class="btn primary grow" id="addPerson">＋ 인물 추가</button>
      <button class="btn" id="reset">초기화</button>
    </div>
  </section>

  <section class="panel">
    <h2>출력</h2>
    <div class="control"><label>출력 방식</label><select id="exportType"><option value="html">HTML</option><option value="png">PNG</option></select></div>
    <div id="pngBox" style="display:none">
      <div class="control"><label>PNG 해상도</label><select id="pngScale"><option value="1">1× — 기본</option><option value="1.5">1.5×</option><option value="2">2× — 고해상도</option><option value="3">3×</option><option value="4">4× — 초고해상도</option></select></div>
    </div>
    <button class="btn primary" id="exportBtn" style="width:100%">HTML로 저장</button>
    <div class="hint">HTML은 현재 편집 상태를 하나의 파일로 저장합니다. PNG는 페이지별 이미지로 저장됩니다.</div>
  </section>
</aside>

<main class="preview-area">
  <div class="preview-wrap">
    <div class="preview-toolbar"><span class="live">LIVE PREVIEW</span><div class="row"><button class="btn tiny" id="fontMinus">A−</button><button class="btn tiny" id="fontPlus">A＋</button></div></div>
    <div id="preview" class="paper-frame"></div>
  </div>
</main>
</div>

<script>
const SAMPLE={
  layout:"literary",kicker:"TXH",
  title:"피로 젖은 손으로는\\n아무것도\\n붙잡을 수 없었다",
  coupling:"현도태건",pageNumber:"show",pagePosition:"center",
  font:'"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif',
  titleFont:'"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif',
  bodySize:16,titleSize:37,nameSize:23,fontWeight:400,titleWeight:700,lineHeight:1.95,letterSpacing:-.018,paragraphGap:14,padX:64,padY:60,titleGap:102,contentWidth:76,
  ruleWidth:"1px",exportType:"html",pngScale:"2",
  colors:{stage:"#0f0f0f",paper:"#f3f2ef",ink:"#141414",line:"#161616",bubble:"#ffffff"},
  persons:[
    {name:"진현도",sub:"",quotes:[
      {type:"dialogue",bubble:false,text:"“형님은…… 저를 왜 도와주시는 겁니까?”"},
      {type:"narration",bubble:false,text:"진현도는 젖은 장작에 불을 붙이다가 손을 멈췄다. 불씨가 희미하게 타오르며 두 사람의 얼굴을 번갈아 비췄다."},
      {type:"dialogue",bubble:true,text:"“……네가 개죽음을 당하든 말든 내 알 바 아니다.”"},
      {type:"dialogue",bubble:false,text:"“그런데 왜……”"},
      {type:"dialogue",bubble:true,text:"“나도 거기서 나왔으니까.”"},
      {type:"narration",bubble:false,text:"나 역시 누가 한 번쯤은 데리고 나와 줬으면 했거든. 속에서만 삼킨 말이었다. 허진은 더 묻지 않았다."},
      {type:"narration",bubble:false,text:"그러나 그 사흘 동안 허진이 숨겨둔 것을 진현도는 결국 알아내고야 말았다."}
    ]},
    {name:"이태건",sub:"",quotes:[
      {type:"dialogue",bubble:false,text:"“이걸 들고 있어도 살 길은 없어.”"},
      {type:"dialogue",bubble:true,text:"“알고 있습니다.”"},
      {type:"dialogue",bubble:false,text:"“버려.”"},
      {type:"narration",bubble:false,text:"허진은 고개를 저었다. 그러면 제가 도망친 이유도 없어집니다."}
    ]}
  ]
};
const $=id=>document.getElementById(id), clone=x=>structuredClone(x);
function load(){try{let x=localStorage.getItem("quoteExtractorBeautiful");return x?JSON.parse(x):clone(SAMPLE)}catch(e){return clone(SAMPLE)}}
let state=load();
function save(){localStorage.setItem("quoteExtractorBeautiful",JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function applyVars(){
  const r=document.documentElement.style;
  r.setProperty("--stage",state.colors.stage);r.setProperty("--paper",state.colors.paper);r.setProperty("--ink",state.colors.ink);r.setProperty("--rule",state.colors.line);r.setProperty("--bubble",state.colors.bubble);
  r.setProperty("--body-font",state.font);r.setProperty("--title-font",state.titleFont);
  r.setProperty("--body-size",state.bodySize+"px");r.setProperty("--title-size",state.titleSize+"px");r.setProperty("--name-size",state.nameSize+"px");
  r.setProperty("--font-weight",state.fontWeight);r.setProperty("--title-weight",state.titleWeight);r.setProperty("--line-height",state.lineHeight);
  r.setProperty("--letter-spacing",state.letterSpacing+"em");r.setProperty("--paragraph-gap",state.paragraphGap+"px");r.setProperty("--pad-x",state.padX+"px");r.setProperty("--pad-y",state.padY+"px");r.setProperty("--title-gap",state.titleGap+"px");r.setProperty("--content-width",state.contentWidth+"%");r.setProperty("--rule-width",state.ruleWidth)
}
function sync(){
  const map={layout:"layout",kicker:"kicker",title:"title",coupling:"coupling",pageNumber:"pageNumber",pagePosition:"pagePosition",font:"font",titleFont:"titleFont",ruleWidth:"ruleWidth",exportType:"exportType",pngScale:"pngScale"};
  Object.entries(map).forEach(([id,k])=>$(id).value=state[k]);
  const vals=[["bodySize",state.bodySize,state.bodySize+"px"],["titleSize",state.titleSize,state.titleSize+"px"],["nameSize",state.nameSize,state.nameSize+"px"],["fontWeight",state.fontWeight,state.fontWeight],["titleWeight",state.titleWeight,state.titleWeight],["lineHeight",state.lineHeight,state.lineHeight],["letterSpacing",state.letterSpacing,state.letterSpacing+"em"],["paragraphGap",state.paragraphGap,state.paragraphGap+"px"],["padX",state.padX,state.padX+"px"],["padY",state.padY,state.padY+"px"],["titleGap",state.titleGap,state.titleGap+"px"],["contentWidth",state.contentWidth,state.contentWidth+"%"]];
  vals.forEach(([id,v,o])=>{$(id).value=v;$(id+"Out").textContent=o});
  Object.keys(state.colors).forEach(k=>$(k).value=state.colors[k]);
  $("pngBox").style.display=state.exportType==="png"?"block":"none";
  $("exportBtn").textContent=state.exportType==="png"?"PNG로 저장":"HTML로 저장";
}
function renderEditors(){
  const root=$("editors");root.innerHTML="";
  if(!state.persons.length){root.innerHTML='<div class="empty">인물을 추가해 주세요.</div>';return}
  state.persons.forEach((p,pi)=>{
    const box=document.createElement("div");box.className="person-editor";
    box.innerHTML=`<div class="person-head"><span class="micro">PERSON ${String(pi+1).padStart(2,"0")}</span><div class="row"><button class="btn tiny dup">복제</button><button class="btn tiny danger del">삭제</button></div></div>
      <div class="grid2"><div class="control"><label>화자 이름</label><input class="p-name" type="text" value="${esc(p.name)}"></div><div class="control"><label>인물 소제목</label><input class="p-sub" type="text" value="${esc(p.sub)}"></div></div>
      <div class="entries"></div><button class="btn tiny add">＋ 텍스트 블록 추가</button>`;
    box.querySelector(".p-name").addEventListener("input",e=>{p.name=e.target.value;render();save()});
    box.querySelector(".p-sub").addEventListener("input",e=>{p.sub=e.target.value;render();save()});
    box.querySelector(".dup").addEventListener("click",()=>{state.persons.splice(pi+1,0,clone(p));renderAll()});
    box.querySelector(".del").addEventListener("click",()=>{state.persons.splice(pi,1);renderAll()});
    box.querySelector(".add").addEventListener("click",()=>{p.quotes.push({type:"text",text:""});renderAll()});
    const entries=box.querySelector(".entries");
    p.quotes.forEach((q,qi)=>{
      const e=document.createElement("div");e.className="entry";
      e.innerHTML=`<div class="entry-top"><span class="micro">TEXT BLOCK ${String(qi+1).padStart(2,"0")}</span>
        <button class="btn tiny danger q-del">삭제</button></div>
        <textarea class="q-text" placeholder="긴 글을 그대로 붙여 넣으세요. 자동 줄바꿈됩니다."></textarea>`;
      e.querySelector(".q-text").value=q.text;
      e.querySelector(".q-text").addEventListener("input",x=>{q.text=x.target.value;render();save()});
      e.querySelector(".q-del").addEventListener("click",()=>{p.quotes.splice(qi,1);renderAll()});
      entries.appendChild(e);
    });
    root.appendChild(box);
  });
}
function footer(n){
  const hidden=state.pageNumber==="hide"?"display:none":"";
  return `<div class="footer ${state.pagePosition}"><div class="coupling">${esc(state.coupling)}</div><div class="page-num" style="${hidden}">${n}</div></div><div class="watermark">QUOTE EXTRACTOR</div>`;
}
function literaryPage(){
  const page=document.createElement("section");page.className="page literary";
  page.innerHTML=`<div class="page-inner"><div class="kicker">${esc(state.kicker)}</div><div class="title">${esc(state.title)}</div><div class="literary-body"></div></div>${footer(1)}`;
  const body=page.querySelector(".literary-body");
  state.persons.forEach(p=>p.quotes.forEach(q=>{
    const d=document.createElement("div");
    d.className="paragraph";
    d.textContent=q.text||" ";
    body.appendChild(d);
  }));
  return [page];
}
function archivePage(){
  const page=document.createElement("section");
  page.className="page archive";
  page.innerHTML=`<div class="page-inner"><div class="body"></div></div>${footer(1)}`;
  const body=page.querySelector(".body");

  state.persons.forEach(p=>{
    const block=document.createElement("div");
    block.className="archive-person";
    block.innerHTML=`
      <div class="archive-row">
        <div class="archive-person-meta">
          <div class="archive-name">${esc(p.name)}</div>
          ${p.sub ? `<div class="archive-sub">${esc(p.sub)}</div>` : ""}
        </div>
        <div class="archive-quotes"></div>
      </div>
    `;

    const qroot=block.querySelector(".archive-quotes");

    p.quotes.forEach(q=>{
      const d=document.createElement("div");
      d.className="archive-line "+q.type+(q.bubble&&q.type==="dialogue"?" bubble":"");
      d.textContent=q.text || " ";
      qroot.appendChild(d);
    });

    body.appendChild(block);
  });

  return [page];
}
function render(){
  applyVars();
  const root=$("preview");root.innerHTML="";
  (state.layout==="archive"?archivePage():literaryPage()).forEach(p=>root.appendChild(p));
}
function renderAll(){sync();renderEditors();render();save()}

const direct={layout:"layout",kicker:"kicker",title:"title",coupling:"coupling",pageNumber:"pageNumber",pagePosition:"pagePosition",font:"font",titleFont:"titleFont",ruleWidth:"ruleWidth"};
Object.entries(direct).forEach(([id,key])=>$(id).addEventListener("input",e=>{state[key]=e.target.value;render();save()}));
[
["bodySize","bodySize"],["titleSize","titleSize"],["nameSize","nameSize"],["fontWeight","fontWeight"],["titleWeight","titleWeight"],["lineHeight","lineHeight"],["letterSpacing","letterSpacing"],["paragraphGap","paragraphGap"],["padX","padX"],["padY","padY"],["titleGap","titleGap"],["contentWidth","contentWidth"]
].forEach(([id,key])=>$(id).addEventListener("input",e=>{
  state[key]=+e.target.value;
  const suffix=key==="letterSpacing"?"em":key==="lineHeight"?"":key==="contentWidth"?"%":"px";
  $(id+"Out").textContent=state[key]+suffix;render();save();
}));
["stage","paper","ink","line","bubble"].forEach(k=>$(k).addEventListener("input",e=>{state.colors[k]=e.target.value;render();save()}));
$("exportType").addEventListener("change",e=>{state.exportType=e.target.value;sync();save()});
$("pngScale").addEventListener("change",e=>{state.pngScale=e.target.value;save()});
$("addPerson").addEventListener("click",()=>{state.persons.push({name:"새 화자",sub:"",quotes:[{type:"text",text:""}]});renderAll()});
$("reset").addEventListener("click",()=>{if(confirm("샘플 설정으로 초기화할까요?")){state=clone(SAMPLE);renderAll()}});
$("fontMinus").addEventListener("click",()=>{state.bodySize=Math.max(10,state.bodySize-.5);renderAll()});
$("fontPlus").addEventListener("click",()=>{state.bodySize=Math.min(28,state.bodySize+.5);renderAll()});

function setBookkPreset(kind, weight){
  if(kind==="myungjo"){
    state.font='"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif';
    state.titleFont='"BookkMyungjo","Noto Serif KR","Nanum Myeongjo","Gowun Batang",serif';
  }else{
    state.font='"BookkGothic","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    state.titleFont='"BookkGothic","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  }
  state.fontWeight=weight;
  state.titleWeight=weight;
  renderAll();
}
$("bookkMyungjoNormal").addEventListener("click",()=>setBookkPreset("myungjo",400));
$("bookkMyungjoBold").addEventListener("click",()=>setBookkPreset("myungjo",700));
$("bookkGothicNormal").addEventListener("click",()=>setBookkPreset("gothic",400));
$("bookkGothicBold").addEventListener("click",()=>setBookkPreset("gothic",700));


async function exportPNG(){
  if(!window.html2canvas){alert("PNG 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return}
  const pages=[...document.querySelectorAll(".page")],scale=Number(state.pngScale||2);
  for(let i=0;i<pages.length;i++){
    const canvas=await html2canvas(pages[i],{scale,backgroundColor:null,useCORS:true,logging:false});
    await new Promise(resolve=>canvas.toBlob(blob=>{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`quote-extractor-${i+1}.png`;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1200);resolve();
    },"image/png"));
  }
}
function exportHTML(){
  const embedded=JSON.stringify(state).replace(/</g,"\\u003c");
  const source="<!doctype html>\\n"+document.documentElement.outerHTML.replace("</head>",`<script>window.__EMBEDDED_QUOTE_STATE__=${embedded};<\\/script></head>`);
  const blob=new Blob([source],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="quote-extractor.html";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
$("exportBtn").addEventListener("click",()=>state.exportType==="png"?exportPNG():exportHTML());
if(window.__EMBEDDED_QUOTE_STATE__)state=window.__EMBEDDED_QUOTE_STATE__;
renderAll();
</script>
</body>
